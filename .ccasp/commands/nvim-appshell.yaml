id: nvim-appshell
title: CCASP Neovim Appshell - Interactive Menu
description: CCASP Neovim Appshell - Interactive Menu
codex_support: unsupported
system: You are a senior systems architect.
instructions:
  - Interactive menu for the Neovim Appshell Layout Redesign project.
  - "## Instructions"
  - Show the user the current status and available actions for the **CCASP Neovim Appshell Layout Redesign**.
  - "### Step 1: Load Progress"
  - Read `.claude/docs/nvim-appshell/PROGRESS.json`.
  - "### Step 2: Display Status Dashboard"
  - "Show a formatted status view:"
  - "```"
  - ╔══════════════════════════════════════════════╗
  - ║   CCASP Neovim Appshell Layout Redesign     ║
  - "║   Issue #114 | Scale: M | Status: {status}  ║"
  - ╠══════════════════════════════════════════════╣
  - ║                                              ║
  - "║  Phase 1: Foundation        [status]         ║"
  - ║    1.1 Layout orchestrator  [status]         ║
  - ║    1.2 Icon rail            [status]         ║
  - ║    1.3 Highlight groups     [status]         ║
  - ║                                              ║
  - "║  Phase 2: Header & Footer   [status]         ║"
  - ║    2.1 Header navbar        [status]         ║
  - ║    2.2 Footer status bar    [status]         ║
  - ║    2.3 Topbar/logo wire     [status]         ║
  - ║                                              ║
  - "║  Phase 3: Flyout + Content  [status]         ║"
  - ║    3.1 Flyout sidebar       [status]         ║
  - ║    3.2 Content manager      [status]         ║
  - ║    3.3 Sessions update      [status]         ║
  - ║                                              ║
  - "║  Phase 4: Integration       [status]         ║"
  - ║    4.1 Init.lua wiring      [status]         ║
  - ║    4.2 Panel positions      [status]         ║
  - ║    4.3 New commands          [status]         ║
  - ║    4.4 Right panel          [status]         ║
  - ║                                              ║
  - "║  Phase 5: Polish            [status]         ║"
  - ║    5.1 Resize handling      [status]         ║
  - ║    5.2 Keyboard nav         [status]         ║
  - ║    5.3 Testing              [status]         ║
  - ║                                              ║
  - ╚══════════════════════════════════════════════╝
  - "```"
  - "### Step 3: Offer Actions"
  - "Present the user with these options:"
  - "- **Execute next phase** - Run `/nvim-appshell-executor` for the next pending phase"
  - "- **View exploration docs** - Show exploration summary"
  - "- **View executive summary** - Show the executive summary"
  - "- **Open GitHub issue** - Link to Issue #114"
  - "- **View specific phase** - Read detailed phase breakdown"
  - "### Key Files"
  - "- Progress: `.claude/docs/nvim-appshell/PROGRESS.json`"
  - "- Executive Summary: `.claude/docs/nvim-appshell/EXECUTIVE_SUMMARY.md`"
  - "- Phase Breakdown: `.claude/exploration/nvim-appshell/PHASE_BREAKDOWN.md`"
  - "- GitHub Issue: #114"
