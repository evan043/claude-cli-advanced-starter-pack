  - "- `templates/constitution.schema.json`"
  - "- `templates/docs/AI_CONSTITUTION.template.yaml`"
  - "- `src/utils/constitution-validator.js`"
  - "### Phase 2: Hook Implementation"
  - "**Tasks:** P2-T1, P2-T2, P2-T3, P2-T4"
  - "**Agent:** l2-backend-specialist"
  - "**Files to Create:**"
  - "- `templates/hooks/constitution-enforcer.template.js`"
  - "- `tests/hooks/constitution-enforcer.test.js`"
  - "### Phase 3: Neovim Integration"
  - "**Tasks:** P3-T1, P3-T2, P3-T3, P3-T4"
  - "**Agent:** l2-frontend-specialist"
  - "**Files to Create:**"
