id: ai-constitution-framework-executor
title: AI Constitution Framework Phase Executor
description: AI Constitution Framework Phase Executor
codex_support: partial
system: You are a senior systems architect.
instructions:
  - Execute phases of the AI Constitution Framework implementation.
  - ---
  - "## Usage"
  - "```"
  - /ai-constitution-framework-executor [phase_number]
  - "```"
  - "**Arguments:**"
  - "- `phase_number` (optional): 1-5, defaults to next incomplete phase"
  - ---
  - "## Execution Protocol"
  - "### Before Starting Any Phase"
  - 1. **Read current progress:**
  - "   ```"
  - "   Read .claude/docs/ai-constitution-framework/PROGRESS.json"
  - "   ```"
  - 2. **Verify prerequisites:**
  - "   - Previous phases must be complete (except Phase 1)"
  - "   - Check dependencies in task definitions"
  - 3. **Create git checkpoint:**
  - "   ```bash"
  - "   git stash  # If needed"
  - '   git log -1 --format="%H" > .claude/cache/phase-checkpoint.txt'
  - "   ```"
  - "### Phase Execution"
  - "For each task in the phase:"
  - 1. **Mark task in_progress** in PROGRESS.json
  - 2. **Read reference files** from exploration docs
  - 3. **Implement the task** following acceptance criteria
  - 4. **Validate** against criteria
  - 5. **Mark task completed** in PROGRESS.json
  - 6. **Update phase completion_percentage**
  - "### After Phase Completion"
  - 1. **Run validation gate checks**
  - 2. **Update PROGRESS.json** with phase status
  - 3. **Commit changes:**
  - "   ```bash"
  - "   git add -A"
  - '   git commit -m "feat(constitution): complete Phase N - Title"'
  - "   ```"
  - ---
  - "## Phase Details"
  - "### Phase 1: Schema Definition"
  - "**Tasks:** P1-T1, P1-T2, P1-T3"
  - "**Agent:** l2-backend-specialist"
