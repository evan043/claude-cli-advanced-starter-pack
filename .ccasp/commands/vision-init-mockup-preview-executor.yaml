id: vision-init-mockup-preview-executor
title: Vision Init Mockup Preview - Phase Executor
description: Vision Init Mockup Preview - Phase Executor
system: You are a senior systems architect.
instructions:
  - Execute phases of the Vision Init HTML Mockup Preview plan.
  - "## PROGRESS.json Location"
  - "`.claude/phase-plans/vision-init-mockup-preview/PROGRESS.json`"
  - "## Exploration Documents"
  - "`.claude/exploration/vision-init-mockup-preview/`"
  - "## Execution Protocol"
  - "### Before Starting"
  - 1. Read PROGRESS.json to get current state
  - '2. Find the first phase with `status: "pending"` or `status: "in_progress"`'
  - 3. If all phases completed, report completion
  - "### Task Execution (Phase 1: Finalize Template & Deploy)"
  - "**Task 1.1: Review and finalize Step 4b in template**"
  - "- Read `templates/commands/vision-init.template.md`"
  - "- Verify Step 4b is inserted between Step 4 (Generate Architecture) and Step 5 (Security Scan)"
  - "- Verify frontend detection logic checks both features and technologies"
  - "- Verify Playwright MCP tool calls are correct (`mcp__playwright-ext__playwright_navigate`, `mcp__playwright-ext__playwright_screenshot`)"
  - "- Verify `--skip-mockup` flag is handled"
  - "- Verify max 2 adjustment iterations"
  - "- Verify fallback for offline/no Playwright"
  - "- Update PROGRESS.json: mark 1.1 completed"
  - "**Task 1.2: Deploy to CCASP project**"
  - "- Process the template (replace `${CWD}` placeholders with actual paths)"
  - "- Copy processed output to `.claude/commands/vision-init.md`"
  - "- Update PROGRESS.json: mark 1.2 completed"
  - "**Task 1.3: Deploy to BO360 root project**"
  - "- Copy processed output to `F:\\1 - Benefits-Outreach-360 (Web)\\.claude\\commands\\vision-init.md`"
  - "- Update PROGRESS.json: mark 1.3 completed"
  - "**Task 1.4: Run tests**"
  - "- Execute `npm test` in the CCASP directory"
  - "- Verify all tests pass (expect 489+ passing)"
  - "- Update PROGRESS.json: mark 1.4 completed"
  - "**Task 1.5: Commit**"
  - "- Stage modified files: `templates/commands/vision-init.template.md`"
  - "- Create commit: `feat(vision): add HTML mockup preview step to /vision-init`"
  - '- Update PROGRESS.json: mark 1.5 completed, set phase and plan status to "completed"'
  - "### After Each Task"
  - "- Update PROGRESS.json immediately"
  - "- Set task `completed: true` and `completedAt` to current timestamp"
  - "- Recalculate `completion_percentage`"
  - "### On Failure"
  - "- Do NOT skip to next task"
  - "- Record error in task `notes` field"
  - "- Keep task status as `pending`"
  - "- Report error to user"
